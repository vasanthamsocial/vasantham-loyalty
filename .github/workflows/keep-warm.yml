# Pings the live site every 5 minutes so a Vercel server instance stays warm
# and customers rarely wait for a cold start. Free for public repositories.
name: Keep Vercel warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the API (wakes the function and its database connection)
        run: |
          curl -fsS --max-time 30 https://vasantham-loyalty.vercel.app/api/health
          curl -fsS --max-time 30 -o /dev/null https://vasantham-loyalty.vercel.app/api/auth/config
