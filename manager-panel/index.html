<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#094a2b" />
  <title>Manager Panel</title>
  <link rel="icon" href="/shared/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/style.css" />
  <style>
    header.bar { background: var(--brand-dark); color: #fff; padding: 10px 16px; position: sticky; top: 0; z-index: 10; }
    header.bar .row { justify-content: space-between; }
    header.bar b { color: #ffd66b; }
    nav.mtabs { display: flex; gap: 4px; background: #fff; border-bottom: 1px solid var(--line); padding: 0 12px; overflow-x: auto; }
    nav.mtabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 12px 12px 9px; white-space: nowrap; }
    nav.mtabs button.active { color: var(--brand); border-bottom-color: var(--brand); }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .two { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 900px) { .two { grid-template-columns: 1fr 1fr; } }
    #reader { width: 100%; max-width: 420px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
    .cust-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .bal { font-size: 2rem; font-weight: 800; color: var(--brand); font-variant-numeric: tabular-nums; line-height: 1.1; }
    .req { border: 2px solid var(--gold); background: var(--gold-soft); border-radius: 14px; padding: 16px; }
    .req .amount { font-size: 1.6rem; font-weight: 800; }
    .offer-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; background: #fff; }
    .offer-row.personal { background: var(--gold-soft); border-color: #f1d48a; }
    .slip { width: 300px; margin: 0 auto; background: #fff; color: #000; padding: 14px 16px; border: 1px dashed #999; font-family: 'Courier New', ui-monospace, monospace; font-size: 13px; }
    .slip h3 { text-align: center; margin: 0 0 4px; font-size: 16px; letter-spacing: .08em; }
    .slip .line { display: flex; justify-content: space-between; gap: 8px; }
    .slip hr { border: 0; border-top: 1px dashed #000; margin: 8px 0; }
    .slip .qr svg { width: 110px; height: 110px; display: block; margin: 6px auto; }
    .slip .big { font-size: 18px; font-weight: 700; text-align: center; }
    @media print { @page { size: 80mm auto; margin: 2mm; } .slip { border: 0; width: 76mm; } }
    .login { max-width: 380px; margin: 10vh auto; padding: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/manager/app.js"></script>
</body>
</html>
