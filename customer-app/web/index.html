<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e6b3f" />
  <title>Vasantham Rewards</title>
  <link rel="icon" href="/shared/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/style.css" />
  <style>
    body { padding-bottom: 76px; }
    header.app { background: var(--brand); color: #fff; padding: 14px 16px 12px; position: sticky; top: 0; z-index: 10; }
    header.app .row { justify-content: space-between; }
    header.app .brand { font-weight: 800; letter-spacing: .02em; }
    header.app .brand span { color: #ffd66b; }
    header.app button { background: transparent; border: 0; color: #fff; padding: 4px 6px; position: relative; }
    .dot { position: absolute; top: 0; right: 0; width: 9px; height: 9px; background: #ffd66b; border-radius: 50%; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
    nav.tabs button { flex: 1; border: 0; border-radius: 0; background: none; flex-direction: column; gap: 2px; font-size: .72rem; color: var(--muted); padding: 8px 2px 10px; font-weight: 600; }
    nav.tabs button.active { color: var(--brand); }
    nav.tabs svg { width: 22px; height: 22px; }
    nav.tabs .qr-tab svg { width: 30px; height: 30px; background: var(--brand); color: #fff; border-radius: 50%; padding: 5px; margin-top: -14px; box-shadow: 0 2px 8px rgb(0 0 0 / 20%); }
    .points-card { background: linear-gradient(135deg, var(--brand) 0%, #13824f 60%, #1b9a60 100%); color: #fff; border-radius: 16px; padding: 18px; }
    .points-card .big { font-size: 2.3rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .points-card .value { background: rgb(255 255 255 / 16%); border-radius: 10px; padding: 6px 10px; display: inline-block; margin-top: 6px; font-weight: 700; }
    .points-card button { background: #fff; color: var(--brand); border: 0; }
    .points-card .btn-gold { background: var(--gold); color: #fff; }
    .offer { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; }
    .offer.personal { border-color: #f1d48a; background: var(--gold-soft); }
    .offer .title { font-weight: 700; }
    .section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 8px; }
    .section-title h2 { margin: 0; }
    .login { max-width: 420px; margin: 8vh auto 0; padding: 16px; }
    .login .logo { font-size: 1.7rem; font-weight: 800; color: var(--brand); }
    .login .logo span { color: var(--gold); }
    .otp-input { letter-spacing: .5em; font-size: 1.3rem; text-align: center; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chips button { padding: .35rem .7rem; border-radius: 999px; font-size: .85rem; }
    .countdown { font-variant-numeric: tabular-nums; font-weight: 700; }
    .savings-total { font-size: 1.8rem; font-weight: 800; color: var(--brand); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/customer/app.js"></script>
</body>
</html>
